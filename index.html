<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural ANPR & Blur Plate Reconstruction Engine</title>
  <!-- ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  <!-- OpenCV.js -->
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --card: #0f172a;
      --border: #1e293b;
      --accent: #00e5ff;
      --success: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; display: flex; justify-content: center; }
    .container { max-width: 1120px; width: 100%; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
    h1 { color: var(--accent); font-size: 1.45rem; }
    .status-pill { background: #064e3b; color: #34d399; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; max-width: 480px; }
    .upload-zone { background: var(--card); border: 2px dashed var(--accent); border-radius: 10px; padding: 24px; text-align: center; margin-bottom: 20px; }
    input[type="file"] { color: var(--text); font-size: 0.95rem; cursor: pointer; }
    button { margin-top: 14px; padding: 12px 28px; background: var(--accent); color: #040812; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .card h3 { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    canvas { width: 100%; height: 220px; object-fit: contain; background: #030712; border: 1px solid var(--border); border-radius: 6px; }
    .result-card { margin-top: 20px; background: var(--card); border: 1px solid var(--success); border-radius: 10px; padding: 20px; display: none; }
    .plate-box { font-size: 2.2rem; font-weight: 800; font-family: monospace; color: var(--success); letter-spacing: 4px; margin: 8px 0; }
    .logs { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Neural ANPR & Pixel Recovery Engine</h1>
        <p style="color:var(--muted); font-size:0.85rem;">Custom YOLOv8 Detector + Residual Deblur CNN + Perspective Alignment</p>
      </div>
      <div class="status-pill" id="engineStatus">Initializing AI Models...</div>
    </header>

    <div class="upload-zone">
      <input type="file" id="imageUpload" accept="image/*" disabled />
      <br />
      <button id="processBtn" disabled>Run Neural Detection, Deblur & OCR</button>
    </div>

    <div class="grid">
      <div class="card">
        <h3>1. Input Vehicle Image</h3>
        <canvas id="inputCanvas"></canvas>
      </div>
      <div class="card">
        <h3>2. AI Detected & Straightened Plate</h3>
        <canvas id="cropCanvas"></canvas>
      </div>
      <div class="card">
        <h3>3. Neural Pixel Deblur Output</h3>
        <canvas id="deblurCanvas"></canvas>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div style="font-size:0.8rem; color:var(--muted);">EXTRACTED INDIAN REGISTRATION NUMBER:</div>
      <div class="plate-box" id="plateNumber">--</div>
      <div class="logs" id="pipelineLogs"></div>
    </div>
  </div>

  <script>
    // Fix ONNX Runtime WASM binary CDN path
    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/";
    ort.env.wasm.numThreads = 1;

    let detectorSession = null;
    let enhancerSession = null;
    let cvLoaded = false;

    const statusEl = document.getElementById('engineStatus');
    const uploadEl = document.getElementById('imageUpload');
    const processBtn = document.getElementById('processBtn');
    const inputCanvas = document.getElementById('inputCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const deblurCanvas = document.getElementById('deblurCanvas');

    async function initModels() {
      try {
        statusEl.textContent = "Loading plate_detector.onnx...";
        detectorSession = await ort.InferenceSession.create('./plate_detector.onnx', {
          executionProviders: ['wasm']
        });

        statusEl.textContent = "Loading pixel_enhancer.onnx...";
        enhancerSession = await ort.InferenceSession.create('./pixel_enhancer.onnx', {
          executionProviders: ['wasm']
        });

        checkReady();
      } catch (err) {
        statusEl.textContent = "Error: " + (err.message || err);
        statusEl.style.background = "#7f1d1d";
        statusEl.style.color = "#fca5a5";
        console.error(err);
      }
    }

    function onOpenCvReady() {
      cvLoaded = true;
      checkReady();
    }

    function checkReady() {
      if (detectorSession && enhancerSession && cvLoaded) {
        statusEl.textContent = "All Neural Engines Online (Ready)";
        statusEl.style.background = "#064e3b";
        statusEl.style.color = "#34d399";
        uploadEl.disabled = false;
      } else if (detectorSession && enhancerSession && !cvLoaded) {
        statusEl.textContent = "Models Loaded, Waiting for OpenCV...";
      }
    }

    initModels();

    uploadEl.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        inputCanvas.width = img.width;
        inputCanvas.height = img.height;
        inputCanvas.getContext('2d').drawImage(img, 0, 0);
        processBtn.disabled = false;
      };
      img.src = URL.createObjectURL(file);
    });

    function fixIndianRTO(raw) {
      const clean = raw.replace(/[^A-Z0-9]/gi, '').toUpperCase();
      if (clean.length < 6 || clean.length > 10) return clean || "UNREADABLE";
      const chars = clean.split('');
      const n2c = { '0': 'O', '1': 'I', '2': 'Z', '5': 'S', '8': 'B', '6': 'G' };
      const c2n = { 'O': '0', 'Q': '0', 'D': '0', 'I': '1', 'L': '1', 'Z': '2', 'S': '5', 'B': '8', 'G': '6' };

      for (let i = 0; i < Math.min(2, chars.length); i++) if (n2c[chars[i]]) chars[i] = n2c[chars[i]];
      for (let i = 2; i < Math.min(4, chars.length); i++) if (c2n[chars[i]]) chars[i] = c2n[chars[i]];
      for (let i = Math.max(4, chars.length - 4); i < chars.length; i++) if (c2n[chars[i]]) chars[i] = c2n[chars[i]];
      return chars.join('');
    }

    function orderCorners(pts) {
      pts.sort((a, b) => a.x - b.x);
      const left = pts.slice(0, 2).sort((a, b) => a.y - b.y);
      const right = pts.slice(2, 4).sort((a, b) => a.y - b.y);
      return [left[0], right[0], right[1], left[1]];
    }

    async function detectPlateWithYOLO(canvas) {
      const temp = document.createElement('canvas');
      temp.width = 640; temp.height = 640;
      const tctx = temp.getContext('2d');
      tctx.drawImage(canvas, 0, 0, 640, 640);
      const imgData = tctx.getImageData(0, 0, 640, 640).data;

      const floatData = new Float32Array(3 * 640 * 640);
      for (let i = 0; i < 640 * 640; i++) {
        floatData[i] = imgData[i * 4] / 255.0;
        floatData[640 * 640 + i] = imgData[i * 4 + 1] / 255.0;
        floatData[2 * 640 * 640 + i] = imgData[i * 4 + 2] / 255.0;
      }

      const tensor = new ort.Tensor('float32', floatData, [1, 3, 640, 640]);
      const feeds = {};
      feeds[detectorSession.inputNames[0]] = tensor;
      const results = await detectorSession.run(feeds);
      const output = results[detectorSession.outputNames[0]].data;

      let bestConf = 0.25;
      let bestBox = null;
      const numAnchors = 8400;

      for (let i = 0; i < numAnchors; i++) {
        const conf = output[4 * numAnchors + i];
        if (conf > bestConf) {
          bestConf = conf;
          const xc = output[0 * numAnchors + i];
          const yc = output[1 * numAnchors + i];
          const w = output[2 * numAnchors + i];
          const h = output[3 * numAnchors + i];
          bestBox = {
            x: (xc - w / 2) * (canvas.width / 640),
            y: (yc - h / 2) * (canvas.height / 640),
            w: w * (canvas.width / 640),
            h: h * (canvas.height / 640),
            conf: conf
          };
        }
      }
      return bestBox;
    }

    async function runNeuralDeblur(plateCanvas) {
      const temp = document.createElement('canvas');
      temp.width = 192; temp.height = 64;
      const tctx = temp.getContext('2d');
      tctx.drawImage(plateCanvas, 0, 0, 192, 64);
      const imgData = tctx.getImageData(0, 0, 192, 64).data;

      const inputArr = new Float32Array(3 * 64 * 192);
      for (let i = 0; i < 64 * 192; i++) {
        inputArr[i] = imgData[i * 4] / 255.0;
        inputArr[64 * 192 + i] = imgData[i * 4 + 1] / 255.0;
        inputArr[2 * 64 * 192 + i] = imgData[i * 4 + 2] / 255.0;
      }

      const tensor = new ort.Tensor('float32', inputArr, [1, 3, 64, 192]);
      const feeds = {};
      feeds[enhancerSession.inputNames[0]] = tensor;
      const outMap = await enhancerSession.run(feeds);
      const outData = outMap[enhancerSession.outputNames[0]].data;

      const outImg = tctx.createImageData(192, 64);
      for (let i = 0; i < 64 * 192; i++) {
        outImg.data[i * 4] = Math.min(255, Math.max(0, outData[i] * 255));
        outImg.data[i * 4 + 1] = Math.min(255, Math.max(0, outData[64 * 192 + i] * 255));
        outImg.data[i * 4 + 2] = Math.min(255, Math.max(0, outData[2 * 64 * 192 + i] * 255));
        outImg.data[i * 4 + 3] = 255;
      }
      tctx.putImageData(outImg, 0, 0);

      deblurCanvas.width = 384;
      deblurCanvas.height = 128;
      const dctx = deblurCanvas.getContext('2d');
      dctx.filter = "grayscale(100%) contrast(145%)";
      dctx.drawImage(temp, 0, 0, 384, 128);
    }

    processBtn.addEventListener('click', async () => {
      processBtn.disabled = true;
      const resultCard = document.getElementById('resultCard');
      const logs = document.getElementById('pipelineLogs');
      resultCard.style.display = 'block';
      logs.textContent = "Step 1: Running custom YOLOv8 plate detection...";

      try {
        const box = await detectPlateWithYOLO(inputCanvas);
        let src = cv.imread(inputCanvas);
        let roi;

        if (box) {
          const padX = box.w * 0.08;
          const padY = box.h * 0.12;
          const x = Math.max(0, Math.floor(box.x - padX));
          const y = Math.max(0, Math.floor(box.y - padY));
          const w = Math.min(src.cols - x, Math.floor(box.w + 2 * padX));
          const h = Math.min(src.rows - y, Math.floor(box.h + 2 * padY));
          roi = src.roi(new cv.Rect(x, y, w, h));
          logs.textContent = `Step 2: Plate localized (${(box.conf * 100).toFixed(1)}% confidence). Applying perspective straightening...`;
        } else {
          roi = src.clone();
          logs.textContent = "Step 2: Using full frame + contour perspective alignment...";
        }

        let gray = new cv.Mat();
        let edged = new cv.Mat();
        cv.cvtColor(roi, gray, cv.COLOR_RGBA2GRAY);
        cv.Canny(gray, edged, 40, 180);
        let contours = new cv.MatVector();
        let hier = new cv.Mat();
        cv.findContours(edged, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let bestQuad = null;
        let maxA = 0;
        for (let i = 0; i < contours.size(); i++) {
          let cnt = contours.get(i);
          let approx = new cv.Mat();
          cv.approxPolyDP(cnt, approx, 0.03 * cv.arcLength(cnt, true), true);
          if (approx.rows === 4) {
            let area = cv.contourArea(approx);
            if (area > maxA && area > (roi.cols * roi.rows * 0.25)) {
              maxA = area;
              if (bestQuad) bestQuad.delete();
              bestQuad = approx;
            } else {
              approx.delete();
            }
          } else {
            approx.delete();
          }
        }

        let straightened = new cv.Mat();
        if (bestQuad) {
          let pts = [];
          for (let i = 0; i < 4; i++) pts.push({ x: bestQuad.intPtr(i, 0)[0], y: bestQuad.intPtr(i, 0)[1] });
          let ord = orderCorners(pts);
          let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [ord[0].x, ord[0].y, ord[1].x, ord[1].y, ord[2].x, ord[2].y, ord[3].x, ord[3].y]);
          let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, 384, 0, 384, 128, 0, 128]);
          let M = cv.getPerspectiveTransform(srcTri, dstTri);
          cv.warpPerspective(roi, straightened, M, new cv.Size(384, 128));
          srcTri.delete(); dstTri.delete(); M.delete(); bestQuad.delete();
        } else {
          cv.resize(roi, straightened, new cv.Size(384, 128), 0, 0, cv.INTER_CUBIC);
        }

        cv.imshow('cropCanvas', straightened);

        logs.textContent = "Step 3: Reconstructing blurry pixels with custom CNN...";
        await runNeuralDeblur(cropCanvas);

        logs.textContent = "Step 4: Extracting characters & applying Indian RTO rules...";
        const { data: { text, confidence } } = await Tesseract.recognize(deblurCanvas, 'eng', {
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
        });

        const finalPlate = fixIndianRTO(text);
        document.getElementById('plateNumber').textContent = finalPlate;
        logs.innerHTML = `Raw OCR Output: <b>${text.trim() || 'None'}</b> | OCR Confidence: <b>${confidence.toFixed(1)}%</b><br>Pipeline: Custom YOLOv8 Detection &rarr; 4-Point Perspective Warp &rarr; Residual CNN Deblur &rarr; RTO Rule Engine`;

        src.delete(); roi.delete(); gray.delete(); edged.delete(); contours.delete(); hier.delete(); straightened.delete();
      } catch (e) {
        logs.textContent = "Error: " + e.message;
        console.error(e);
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
