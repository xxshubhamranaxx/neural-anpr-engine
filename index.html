<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indian ANPR - Plate Detection, Deblur &amp; OCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:#151b23;--line:#27303b;--tx:#e6eaf0;--mut:#8b96a5;--amb:#f2b01e;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Chakra Petch',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:1.5rem;margin:0;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:.85rem;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--amb)}
.badge.ready{color:var(--ok)}.badge.ready .dot{background:var(--ok)}.badge.err{color:var(--bad)}.badge.err .dot{background:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
.btn{display:inline-block;padding:11px 20px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:600 .95rem inherit;font-family:inherit;cursor:pointer}
.btn:hover{border-color:var(--amb)}
.btn.main{background:var(--amb);color:#14110a;border-color:var(--amb)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
#file{position:absolute;opacity:0;width:1px;height:1px}
.pick:focus-within .btn,.btn:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.opt{color:var(--mut);font-size:.85rem;display:flex;gap:6px;align-items:center}
.result{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:22px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.plate{display:flex;align-items:stretch;background:#fff;color:#111;border:3px solid #111;border-radius:8px;overflow:hidden;min-width:300px}
.plate i{background:#1b3fa0;color:#fff;font:700 .6rem/1.2 inherit;font-family:inherit;font-style:normal;padding:8px 6px;display:flex;align-items:flex-end}
.plate b{font-size:2.1rem;letter-spacing:.08em;padding:6px 18px;font-weight:700;white-space:nowrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.meta small{display:block;color:var(--mut);font-size:.78rem}
.meta span{font-size:1.1rem;word-break:break-all}
.note{grid-column:1/-1;color:var(--mut);font-size:.85rem;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{font-size:.95rem;margin:0 0 10px;font-weight:600}
.card canvas{width:100%;height:auto;display:block;border-radius:6px;background:#0a0d12;min-height:80px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.result{grid-template-columns:1fr}.plate{min-width:0}.plate b{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Indian ANPR &amp; Blur Plate Reconstruction</h1>
  <div id="status" class="badge"><span class="dot"></span><span id="statusTxt">Loading OpenCV and OCR engines...</span></div>
</header>

<div class="bar">
  <span class="pick"><input type="file" id="file" accept="image/*"><label class="btn" for="file">Select Vehicle Image</label></span>
  <button id="run" class="btn main" disabled>Run Plate Detection, Pixel Deblur &amp; OCR</button>
  <label class="opt"><input type="checkbox" id="useOnnx"> Try pixel_enhancer.onnx (experimental, keep off)</label>
</div>

<section class="result" aria-live="polite">
  <div class="plate"><i>IND</i><b id="plateTxt">-- -- -- ----</b></div>
  <div class="meta">
    <div><small>Registration number</small><span id="fmt">Waiting for image</span></div>
    <div><small>Raw OCR text</small><span id="raw">-</span></div>
    <div><small>Confidence</small><span id="conf">-</span></div>
  </div>
  <p class="note" id="note">Select a vehicle image, then run detection.</p>
</section>

<div class="grid">
  <div class="card"><h2>1. Input Vehicle Image</h2><canvas id="cIn" width="400" height="260"></canvas></div>
  <div class="card"><h2>2. Detected &amp; Straightened Plate</h2><canvas id="cPlate" width="400" height="100"></canvas></div>
  <div class="card"><h2>3. HD Reconstructed Pixel Output</h2><canvas id="cHD" width="400" height="100"></canvas></div>
</div>
</div>

<script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const del = (...m) => m.forEach(x => { try { x && x.delete && x.delete(); } catch (e) {} });
const STATES = new Set('AN AP AR AS BR CH CG DD DL DN GA GJ HP HR JH JK KA KL LA LD MH ML MN MP MZ NL OD OR PB PY RJ SK TN TR TS UK UP WB BH'.split(' '));
let cvReady = false, worker = null, ocrReady = false, srcCanvas = null, busy = false, onnxSession = null;

function setStatus(txt, cls) { $('statusTxt').textContent = txt; $('status').className = 'badge ' + (cls || ''); }
function refreshStatus() {
  if (cvReady && ocrReady) setStatus('OpenCV and OCR engines ready', 'ready');
  else setStatus((cvReady ? 'OpenCV ready' : 'Loading OpenCV') + ' / ' + (ocrReady ? 'OCR ready' : 'Loading OCR') + '...');
  $('run').disabled = !(cvReady && ocrReady && srcCanvas) || busy;
}

/* ---------- Engine loading ---------- */
async function waitCV() {
  for (let i = 0; i < 600; i++) {
    if (typeof cv !== 'undefined') {
      if (cv instanceof Promise) window.cv = await cv;
      if (cv.Mat && cv.imread) return true;
      if (!cv.__hooked) { cv.__hooked = true; cv.onRuntimeInitialized = () => { cvReady = true; refreshStatus(); }; }
    }
    await sleep(100);
  }
  return false;
}
async function initOCR() {
  for (let i = 0; i < 300 && typeof Tesseract === 'undefined'; i++) await sleep(100);
  worker = await Tesseract.createWorker('eng');
  await worker.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', preserve_interword_spaces: '0' });
  ocrReady = true; refreshStatus();
}
async function initOnnx() {
  try {
    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/';
    ort.env.wasm.numThreads = 1; ort.env.wasm.simd = false;
    onnxSession = await ort.InferenceSession.create('pixel_enhancer.onnx', { executionProviders: ['wasm'] });
  } catch (e) { onnxSession = null; console.warn('pixel_enhancer.onnx unavailable, using OpenCV enhancer', e); }
}
(async () => {
  waitCV().then(ok => { if (ok) { cvReady = true; refreshStatus(); } else setStatus('OpenCV failed to load', 'err'); });
  initOCR().catch(e => { console.error(e); setStatus('OCR engine failed to load', 'err'); });
})();

/* ---------- Image input ---------- */
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 1280 / Math.max(img.width, img.height));
    srcCanvas = document.createElement('canvas');
    srcCanvas.width = Math.round(img.width * s); srcCanvas.height = Math.round(img.height * s);
    srcCanvas.getContext('2d').drawImage(img, 0, 0, srcCanvas.width, srcCanvas.height);
    showCanvas($('cIn'), srcCanvas);
    ['cPlate', 'cHD'].forEach(id => { const c = $(id); c.width = 400; c.height = 100; c.getContext('2d').clearRect(0, 0, 400, 100); });
    $('plateTxt').textContent = '-- -- -- ----'; $('fmt').textContent = 'Ready to run'; $('raw').textContent = '-'; $('conf').textContent = '-';
    $('note').textContent = 'Image loaded. Press the run button.';
    URL.revokeObjectURL(img.src); refreshStatus();
  };
  img.onerror = () => { $('note').textContent = 'That file could not be read as an image. Try a JPG or PNG.'; };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
});
function showCanvas(dst, src) { dst.width = src.width; dst.height = src.height; dst.getContext('2d').drawImage(src, 0, 0); }

/* ---------- Plate localisation ---------- */
function ptsOf(rect) { return cv.RotatedRect.points(rect); }
function findPlate(src) {
  const W = src.cols, H = src.rows, imgArea = W * H;
  const gray = new cv.Mat(), blur = new cv.Mat();
  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
  const masks = [];
  const bin = new cv.Mat(); cv.threshold(blur, bin, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);
  const k1 = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5)); cv.morphologyEx(bin, bin, cv.MORPH_CLOSE, k1);
  masks.push(bin);
  const edge = new cv.Mat(); cv.Canny(blur, edge, 60, 160);
  const k2 = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(17, 5)); cv.morphologyEx(edge, edge, cv.MORPH_CLOSE, k2);
  masks.push(edge);
  let best = null;
  for (const m of masks) {
    const cs = new cv.MatVector(), hi = new cv.Mat();
    cv.findContours(m, cs, hi, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    for (let i = 0; i < cs.size(); i++) {
      const c = cs.get(i), area = cv.contourArea(c);
      if (area > imgArea * 0.002 && area < imgArea * 0.5) {
        const r = cv.minAreaRect(c), lo = Math.max(r.size.width, r.size.height), sh = Math.min(r.size.width, r.size.height);
        const ar = lo / Math.max(sh, 1), fill = area / Math.max(lo * sh, 1);
        if (ar > 1.8 && ar < 6.8 && fill > 0.55) {
          const br = cv.boundingRect(c), roi = gray.roi(br), mean = new cv.Mat(), sd = new cv.Mat();
          cv.meanStdDev(roi, mean, sd); const std = sd.data64F[0]; del(roi, mean, sd);
          if (std > 25) {
            const score = fill * (1 - Math.abs(Math.log(ar / 4.5)) * 0.35) * Math.sqrt(area / imgArea) * Math.min(std, 70) / 70;
            if (!best || score > best.score) best = { score, rect: r, pts: ptsOf(r), found: true };
          }
        }
      }
      c.delete();
    }
    del(cs, hi);
  }
  del(gray, blur, bin, edge, k1, k2);
  if (best) return best;
  const rect = { center: { x: W / 2, y: H * 0.55 }, size: { width: W * 0.5, height: W * 0.5 / 4.5 }, angle: 0 };
  return { score: 0, rect, pts: ptsOf(rect), found: false };
}

function cropStraight(src, det) {
  const p = det.pts, e1 = [p[1].x - p[0].x, p[1].y - p[0].y], e2 = [p[2].x - p[1].x, p[2].y - p[1].y];
  const l1 = Math.hypot(...e1), l2 = Math.hypot(...e2), e = l1 >= l2 ? e1 : e2;
  let ang = Math.atan2(e[1], e[0]) * 180 / Math.PI;
  while (ang > 90) ang -= 180; while (ang <= -90) ang += 180;
  if (!det.found) ang = 0;
  const L = Math.max(l1, l2), S = Math.min(l1, l2), c = det.rect.center;
  const M = cv.getRotationMatrix2D(new cv.Point(c.x, c.y), ang, 1), rot = new cv.Mat();
  cv.warpAffine(src, rot, M, new cv.Size(src.cols, src.rows), cv.INTER_CUBIC, cv.BORDER_REPLICATE, new cv.Scalar());
  const cw = L * 1.02, ch = S * 0.94;
  const x0 = Math.max(0, Math.round(c.x - cw / 2)), y0 = Math.max(0, Math.round(c.y - ch / 2));
  const w = Math.max(8, Math.min(rot.cols - x0, Math.round(cw))), h = Math.max(8, Math.min(rot.rows - y0, Math.round(ch)));
  const roi = rot.roi(new cv.Rect(x0, y0, w, h)), gray = new cv.Mat();
  cv.cvtColor(roi, gray, cv.COLOR_RGBA2GRAY);
  const rgba = roi.clone(); del(roi, rot, M);
  // trim dark top/bottom/side borders, keep full character width
  const bin = new cv.Mat(); cv.threshold(gray, bin, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);
  const d = bin.data, gw = gray.cols, gh = gray.rows, rowF = new Float32Array(gh), colF = new Float32Array(gw);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) if (d[y * gw + x]) { rowF[y]++; colF[x]++; }
  for (let y = 0; y < gh; y++) rowF[y] /= gw; for (let x = 0; x < gw; x++) colF[x] /= gh;
  let t = 0, b = gh - 1, l = 0, r = gw - 1;
  while (t < gh * 0.25 && rowF[t] > 0.75) t++;
  while (b > gh * 0.75 && rowF[b] > 0.75) b--;
  while (l < gw * 0.05 && colF[l] > 0.9) l++;
  while (r > gw * 0.95 && colF[r] > 0.9) r--;
  // trim blue IND strip on the left
  const cb = new Float32Array(gw), rd = rgba.data;
  for (let x = 0; x < gw; x++) { let s = 0; for (let y = 0; y < gh; y++) { const i = (y * gw + x) * 4; s += rd[i + 2] - Math.max(rd[i], rd[i + 1]); } cb[x] = s / gh; }
  const l0 = l; while (l < gw * 0.2 && cb[l] > 25) l++; if (l > l0) l += 3;
  del(bin);
  const rr = new cv.Rect(l, t, Math.max(8, r - l + 1), Math.max(8, b - t + 1));
  const outG = gray.roi(rr).clone(), outC = rgba.roi(rr).clone(); del(gray, rgba);
  return { gray: outG, color: outC, angle: ang };
}

/* ---------- Reconstruction ---------- */
function enhance(g) {
  const s = Math.min(5, Math.max(2, 220 / g.rows)), big = new cv.Mat();
  cv.resize(g, big, new cv.Size(Math.round(g.cols * s), Math.round(g.rows * s)), 0, 0, cv.INTER_LANCZOS4);
  const sm = new cv.Mat(); cv.bilateralFilter(big, sm, 5, 30, 5);
  const eq = new cv.Mat();
  try { const cl = new cv.CLAHE(2.0, new cv.Size(8, 8)); cl.apply(sm, eq); cl.delete(); } catch (e) { sm.copyTo(eq); }
  const norm = new cv.Mat(); cv.normalize(eq, norm, 0, 255, cv.NORM_MINMAX);
  const bl = new cv.Mat(), sharp = new cv.Mat();
  cv.GaussianBlur(norm, bl, new cv.Size(0, 0), 1.3);
  cv.addWeighted(norm, 1.6, bl, -0.6, 0, sharp);
  del(sm, eq, bl);
  return { plain: norm, sharp, big };
}
async function onnxEnhance(g) {
  if (!onnxSession) await initOnnx();
  if (!onnxSession) return null;
  for (const ch of [3, 1]) {
    try {
      const h = 64, w = 256, r = new cv.Mat(); cv.resize(g, r, new cv.Size(w, h), 0, 0, cv.INTER_AREA);
      const data = new Float32Array(ch * h * w);
      for (let c = 0; c < ch; c++) for (let i = 0; i < h * w; i++) data[c * h * w + i] = r.data[i] / 255;
      del(r);
      const out = await onnxSession.run({ [onnxSession.inputNames[0]]: new ort.Tensor('float32', data, [1, ch, h, w]) });
      const t = out[onnxSession.outputNames[0]], dm = t.dims;
      if (dm.length !== 4) continue;
      const oc = dm[1], oh = dm[2], ow = dm[3], mx = Math.max(...t.data.slice(0, 2000)), sc = mx <= 1.5 ? 255 : 1;
      const m = new cv.Mat(oh, ow, cv.CV_8UC1);
      for (let i = 0; i < oh * ow; i++) m.data[i] = Math.max(0, Math.min(255, t.data[i] * sc));
      if (oc >= 1) return m;
    } catch (e) { console.warn('ONNX enhance attempt failed', e); }
  }
  return null;
}

/* Wiener deconvolution for horizontal motion blur (PSF = box of length L) */
function wiener(g8, L, K, norm) {
  const w = g8.cols, h = g8.rows, p = L * 2 + 8;
  const f = new cv.Mat(); g8.convertTo(f, cv.CV_32F, 1 / 255);
  const pd = new cv.Mat(); cv.copyMakeBorder(f, pd, 0, 0, p, p, cv.BORDER_REPLICATE);
  const W = cv.getOptimalDFTSize(pd.cols), H = cv.getOptimalDFTSize(pd.rows), pd2 = new cv.Mat();
  cv.copyMakeBorder(pd, pd2, 0, H - pd.rows, 0, W - pd.cols, cv.BORDER_REPLICATE);
  const psf = cv.Mat.zeros(H, W, cv.CV_32F);
  for (let x = -(L >> 1); x < L - (L >> 1); x++) psf.data32F[(x + W) % W] = 1 / L;
  const cplx = m => { const z = cv.Mat.zeros(H, W, cv.CV_32F), v = new cv.MatVector(), c = new cv.Mat(); v.push_back(m); v.push_back(z); cv.merge(v, c); cv.dft(c, c); del(z, v); return c; };
  const G = cplx(pd2), P = cplx(psf), g = G.data32F, q = P.data32F;
  for (let i = 0; i < g.length; i += 2) {
    const a = g[i], b = g[i + 1], c = q[i], d = q[i + 1], den = c * c + d * d + K;
    g[i] = (a * c + b * d) / den; g[i + 1] = (b * c - a * d) / den;
  }
  const out = new cv.Mat(); cv.dft(G, out, cv.DFT_INVERSE | cv.DFT_SCALE | cv.DFT_REAL_OUTPUT);
  const roi = out.roi(new cv.Rect(p, 0, w, h)), n = new cv.Mat(); roi.convertTo(n, cv.CV_8U, 255);
  if (norm !== false) cv.normalize(n, n, 0, 255, cv.NORM_MINMAX);
  const res = n.clone(); del(f, pd, pd2, psf, G, P, out, roi, n);
  return res;
}

/* Estimate horizontal box-blur length from the 2nd-derivative autocorrelation (negative peak at lag L) */
function estimateBlur(src) {
  const g = new cv.Mat(); cv.cvtColor(src, g, cv.COLOR_RGBA2GRAY);
  const w = g.cols, h = g.rows, d = g.data, maxLag = Math.min(60, Math.floor(w / 4)), ac = new Float64Array(maxLag + 1);
  let e0 = 0;
  for (let y = 0; y < h; y += 2) {
    const o = y * w;
    for (let x = 1; x < w - 1; x++) {
      const a = d[o + x - 1] - 2 * d[o + x] + d[o + x + 1]; e0 += a * a;
      for (let l = 3; l <= maxLag && x + l < w - 1; l++) ac[l] += a * (d[o + x + l - 1] - 2 * d[o + x + l] + d[o + x + l + 1]);
    }
  }
  del(g);
  let bl = 0, bv = 0;
  for (let l = 3; l <= maxLag; l++) { const v = ac[l] / (e0 || 1); if (v < bv) { bv = v; bl = l; } }
  return { L: bl, v: bv, blurred: bv < -0.08 };
}
function deblurImage(src, L) {
  const ch = new cv.MatVector(), out = new cv.MatVector(), m = new cv.Mat();
  cv.split(src, ch);
  for (let i = 0; i < 3; i++) out.push_back(wiener(ch.get(i), L, 0.003, false));
  out.push_back(ch.get(3).clone()); cv.merge(out, m); del(ch, out);
  return m;
}

/* ---------- OCR ---------- */
function padded(m) {
  const o = new cv.Mat(); cv.copyMakeBorder(m, o, 30, 30, 40, 40, cv.BORDER_CONSTANT, new cv.Scalar(255, 255, 255, 255)); return o;
}
function toURL(m) {
  const c = document.createElement('canvas'); cv.imshow(c, m); return c.toDataURL('image/png');
}
function makeVariants(plain, sharp, extra) {
  const v = [], bl = new cv.Mat(), otsu = new cv.Mat(), ad = new cv.Mat();
  cv.GaussianBlur(sharp, bl, new cv.Size(3, 3), 0);
  cv.threshold(bl, otsu, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);
  let bs = (Math.round(sharp.rows / 3) | 1); if (bs < 15) bs = 15;
  cv.adaptiveThreshold(bl, ad, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, bs, 12);
  [otsu, ad].forEach(m => { if (cv.mean(m)[0] < 127) cv.bitwise_not(m, m); });
  v.push({ n: 'gray', m: plain, psm: '7' }, { n: 'sharp', m: sharp, psm: '7' }, { n: 'otsu', m: otsu, psm: '7' }, { n: 'adaptive', m: ad, psm: '7' }, { n: 'sharp-multiline', m: sharp, psm: '6' });
  (extra || []).forEach(x => v.push(x));
  del(bl);
  return v;
}
const L2D = { O: '0', Q: '0', D: '0', I: '1', L: '1', Z: '2', S: '5', B: '8', G: '6', T: '7', A: '4' };
const D2L = { '0': 'O', '1': 'I', '2': 'Z', '5': 'S', '8': 'B', '6': 'G', '4': 'A', '7': 'T' };
function fit(s, pat) {
  let out = '', cost = 0;
  for (let i = 0; i < pat.length; i++) {
    const c = s[i], isL = /[A-Z]/.test(c);
    if (pat[i] === 'L') { if (isL) out += c; else if (D2L[c]) { out += D2L[c]; cost++; } else return null; }
    else { if (!isL) out += c; else if (L2D[c]) { out += L2D[c]; cost++; } else return null; }
  }
  return { out, cost };
}
function bestPlate(text, conf) {
  const s = (text || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); let best = null;
  for (const pat of ['LLDDLLDDDD', 'LLDDLDDDDD']) {
    for (let i = 0; i + pat.length <= s.length; i++) {
      const f = fit(s.substr(i, pat.length), pat); if (!f) continue;
      const st = f.out.slice(0, 2);
      const score = 100 - 15 * f.cost - 3 * i - 2 * (s.length - pat.length - i) + (STATES.has(st) ? 25 : -20) + conf * 0.25 + (pat.length === 10 ? 3 : 0);
      if (!best || score > best.score) best = { plate: f.out, score, state: st };
    }
  }
  return best;
}
function formatPlate(p) {
  return p.length === 10 ? `${p.slice(0, 2)} ${p.slice(2, 4)} ${p.slice(4, 6)} ${p.slice(6)}` : `${p.slice(0, 2)} ${p.slice(2, 4)} ${p.slice(4, 5)} ${p.slice(5)}`;
}

/* ---------- Main pipeline ---------- */
$('run').addEventListener('click', async () => {
  if (busy || !srcCanvas || !cvReady || !ocrReady) return;
  busy = true; refreshStatus(); $('note').textContent = 'Detecting plate...';
  const mats = [];
  try {
    const src = cv.imread(srcCanvas); mats.push(src);
    const est = estimateBlur(src), pre = est.blurred;
    let work = src;
    if (pre) { $('note').textContent = `Horizontal motion blur detected (about ${est.L}px). Deblurring the full image...`; await sleep(30); work = deblurImage(src, est.L); mats.push(work); }
    const det = findPlate(work);
    const view = document.createElement('canvas'); showCanvas(view, srcCanvas);
    const x = view.getContext('2d'); x.strokeStyle = '#f2b01e'; x.lineWidth = Math.max(3, view.width / 250); x.beginPath();
    det.pts.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y)); x.closePath(); x.stroke();
    showCanvas($('cIn'), view);

    const crop = cropStraight(work, det); mats.push(crop.gray, crop.color);
    cv.imshow($('cPlate'), crop.color);
    $('note').textContent = (det.found ? `Plate found, straightened by ${crop.angle.toFixed(1)} degrees.` : 'No clear plate contour found, using a centre crop.') + ' Reconstructing...';
    await sleep(30);

    const en = enhance(crop.gray); mats.push(en.plain, en.sharp, en.big);
    let hd = en.sharp;
    if ($('useOnnx').checked) {
      const o = await onnxEnhance(crop.gray);
      if (o) { mats.push(o); hd = o; } else $('note').textContent = 'pixel_enhancer.onnx could not run, using the OpenCV reconstruction.';
    }
    cv.imshow($('cHD'), hd);

    $('note').textContent = 'Deblurring motion blur (Wiener)...';
    await sleep(30);
    const extra = [], wmats = {};
    for (const fr of (pre ? [] : [0.012, 0.018, 0.026])) {
      const L = Math.max(3, Math.round(en.big.cols * fr)), wm = wiener(en.plain, L, 0.008); mats.push(wm);
      wmats['wiener' + L] = wm; extra.push({ n: 'wiener' + L, m: wm, psm: '7' });
      if (fr === 0.018) { const o = new cv.Mat(); cv.GaussianBlur(wm, o, new cv.Size(3, 3), 0); cv.threshold(o, o, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU); if (cv.mean(o)[0] < 127) cv.bitwise_not(o, o); mats.push(o); extra.push({ n: 'wiener' + L + '-otsu', m: o, psm: '7' }); }
    }
    if (!pre) hd = wmats['wiener' + Math.max(3, Math.round(en.big.cols * 0.018))];
    cv.imshow($('cHD'), hd);
    $('note').textContent = 'Running OCR passes...';
    const variants = makeVariants(en.plain, en.sharp, extra); mats.push(variants[2].m, variants[3].m);
    const results = [];
    for (const v of variants) {
      const pm = padded(v.m);
      try {
        await worker.setParameters({ tessedit_pageseg_mode: v.psm });
        const r = await worker.recognize(toURL(pm));
        results.push({ n: v.n, text: r.data.text || '', conf: r.data.confidence || 0 });
      } catch (e) { console.warn('OCR pass failed', v.n, e); }
      del(pm);
    }
    const votes = {}, cands = [];
    results.forEach(r => { const b = bestPlate(r.text, r.conf); if (b) { votes[b.plate] = (votes[b.plate] || 0) + 1; cands.push({ ...b, r }); } });
    cands.forEach(c => c.score += 8 * (votes[c.plate] - 1));
    cands.sort((a, b) => b.score - a.score);
    if (cands.length) {
      const c = cands[0], fmt = formatPlate(c.plate);
      if (wmats[c.r.n]) cv.imshow($('cHD'), wmats[c.r.n]); else if (wmats[c.r.n.replace('-otsu', '')]) cv.imshow($('cHD'), wmats[c.r.n.replace('-otsu', '')]);
      const low = c.r.conf < 50; $('plateTxt').textContent = fmt; $('fmt').textContent = low ? fmt + ' (unverified guess)' : fmt;
      $('raw').textContent = c.r.text.trim().replace(/\s+/g, ' ') || '-'; $('conf').textContent = c.r.conf.toFixed(1) + '%';
      $('note').textContent = `Best match from "${c.r.n}" pass, agreed by ${votes[c.plate]} of ${results.length} passes.` + (STATES.has(c.state) ? '' : ' The state code is not a known RTO code, so check the result.') + (low ? ' OCR confidence is very low, so this is a pattern-corrected guess, not a reliable read.' : '');
    } else {
      const top = results.slice().sort((a, b) => b.conf - a.conf)[0];
      $('plateTxt').textContent = '-- -- -- ----'; $('fmt').textContent = 'No valid registration pattern read';
      $('raw').textContent = top ? (top.text.trim().replace(/\s+/g, ' ') || '(empty)') : '-'; $('conf').textContent = top ? top.conf.toFixed(1) + '%' : '-';
      $('note').textContent = 'OCR output did not fit the Indian RTO format. Try a sharper or closer photo of the plate.';
    }
  } catch (e) {
    console.error(e); $('note').textContent = 'Processing failed: ' + (e && e.message ? e.message : e);
  } finally { mats.forEach(m => del(m)); busy = false; refreshStatus(); }
});
</script>
</body>
