<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural ANPR & Blur Plate Reconstruction Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --card: #0f172a;
      --border: #1e293b;
      --accent: #00e5ff;
      --success: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 1120px; width: 100%; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
    h1 { color: var(--accent); font-size: 1.4rem; }
    .status-pill { background: #064e3b; color: #34d399; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .upload-zone { background: var(--card); border: 2px dashed var(--accent); border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 18px; }
    .file-label { display: inline-block; padding: 10px 22px; background: #1e293b; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
    input[type="file"] { display: none; }
    #fileName { margin-left: 10px; color: var(--muted); font-size: 0.9rem; }
    button { margin-top: 12px; padding: 11px 26px; background: var(--accent); color: #040812; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; font-size: 0.98rem; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .result-card { margin-bottom: 18px; background: var(--card); border: 2px solid var(--success); border-radius: 10px; padding: 16px 20px; display: none; }
    .plate-box { font-size: 2.3rem; font-weight: 800; font-family: monospace; color: var(--success); letter-spacing: 4px; margin: 4px 0; }
    .logs { font-size: 0.83rem; color: var(--muted); line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .card h3 { font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    canvas { width: 100%; height: 210px; object-fit: contain; background: #030712; border: 1px solid var(--border); border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Neural ANPR & Pixel Recovery Engine</h1>
        <p style="color:var(--muted); font-size:0.83rem;">MinAreaRect Deskew + Smooth Edge Reconstruction + Tesseract v5 Worker</p>
      </div>
      <div class="status-pill" id="engineStatus">Loading Engines...</div>
    </header>

    <div class="upload-zone">
      <label for="imageUpload" class="file-label">Select Vehicle Image</label>
      <input type="file" id="imageUpload" accept="image/*" />
      <span id="fileName">No file chosen</span>
      <br />
      <button id="processBtn" disabled>Run Plate Detection, Pixel Deblur & OCR</button>
    </div>

    <div class="result-card" id="resultCard">
      <div style="font-size:0.78rem; color:var(--muted); letter-spacing:1px;">EXTRACTED INDIAN REGISTRATION NUMBER:</div>
      <div class="plate-box" id="plateNumber">--</div>
      <div class="logs" id="pipelineLogs"></div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>1. Input Vehicle Image</h3>
        <canvas id="inputCanvas"></canvas>
      </div>
      <div class="card">
        <h3>2. Detected & Straightened Plate</h3>
        <canvas id="cropCanvas"></canvas>
      </div>
      <div class="card">
        <h3>3. HD Reconstructed Pixel Output</h3>
        <canvas id="deblurCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/";
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.simd = false;

    let enhancerSession = null;
    let ocrWorker = null;
    let imageReady = false;

    const statusEl = document.getElementById('engineStatus');
    const uploadEl = document.getElementById('imageUpload');
    const fileNameEl = document.getElementById('fileName');
    const processBtn = document.getElementById('processBtn');
    const inputCanvas = document.getElementById('inputCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const deblurCanvas = document.getElementById('deblurCanvas');

    function isCvReady() {
      return typeof cv !== 'undefined' && typeof cv.imread === 'function';
    }

    function updateStatus() {
      if (enhancerSession && ocrWorker && isCvReady()) {
        statusEl.textContent = "All Neural Engines Online (Ready)";
        if (imageReady) processBtn.disabled = false;
      }
    }

    const cvCheckTimer = setInterval(() => {
      if (isCvReady()) { clearInterval(cvCheckTimer); updateStatus(); }
    }, 300);

    async function initEngines() {
      try {
        const enhResp = await fetch('./pixel_enhancer.onnx');
        if (!enhResp.ok) throw new Error("HTTP " + enhResp.status);
        enhancerSession = await ort.InferenceSession.create(await enhResp.arrayBuffer(), { executionProviders: ['wasm'] });
      } catch (err) {
        enhancerSession = "fallback";
      }

      // Proper Tesseract v5 Worker initialization
      ocrWorker = await Tesseract.createWorker('eng');
      await ocrWorker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
      });

      updateStatus();
    }
    initEngines();

    uploadEl.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      fileNameEl.textContent = file.name;
      const img = new Image();
      img.onload = () => {
        inputCanvas.width = img.width;
        inputCanvas.height = img.height;
        inputCanvas.getContext('2d').drawImage(img, 0, 0);
        imageReady = true;
        if (ocrWorker && isCvReady()) processBtn.disabled = false;
      };
      img.src = URL.createObjectURL(file);
    });

    function fixIndianRTO(raw) {
      let clean = raw.replace(/[^A-Z0-9]/gi, '').toUpperCase();
      if (clean.startsWith('IND') && clean.length > 9) clean = clean.slice(3);
      if (clean.length < 6) return { formatted: clean || "UNREADABLE", valid: false };
      if (clean.length > 10) clean = clean.slice(0, 10);

      const chars = clean.split('');
      const n2c = { '0': 'O', '1': 'I', '2': 'Z', '5': 'S', '8': 'B', '6': 'G' };
      const c2n = { 'O': '0', 'Q': '0', 'D': '0', 'I': '1', 'L': '1', 'Z': '2', 'S': '5', 'B': '8', 'G': '6' };

      for (let i = 0; i < Math.min(2, chars.length); i++) if (n2c[chars[i]]) chars[i] = n2c[chars[i]];
      for (let i = 2; i < Math.min(4, chars.length); i++) if (c2n[chars[i]]) chars[i] = c2n[chars[i]];
      for (let i = 4; i < chars.length - 4; i++) if (n2c[chars[i]]) chars[i] = n2c[chars[i]];
      for (let i = Math.max(4, chars.length - 4); i < chars.length; i++) if (c2n[chars[i]]) chars[i] = c2n[chars[i]];

      const fixed = chars.join('');
      const isRTO = /^[A-Z]{2}[0-9]{2}[A-Z]{1,2}[0-9]{4}$/.test(fixed);
      let formatted = fixed;
      if (fixed.length === 10) formatted = `${fixed.slice(0,2)} ${fixed.slice(2,4)} ${fixed.slice(4,6)} ${fixed.slice(6)}`;
      else if (fixed.length === 9) formatted = `${fixed.slice(0,2)} ${fixed.slice(2,4)} ${fixed.slice(4,5)} ${fixed.slice(5)}`;
      return { formatted, valid: isRTO };
    }

    async function runNeuralDeblur(plateCanvas) {
      let mat = cv.imread(plateCanvas);
      let up = new cv.Mat();
      let gray = new cv.Mat();
      let smooth = new cv.Mat();
      let sharp = new cv.Mat();
      let norm = new cv.Mat();

      // 1. Lanczos4 Super-Resolution Upscale (640x180)
      cv.resize(mat, up, new cv.Size(640, 180), 0, 0, cv.INTER_LANCZOS4);
      cv.cvtColor(up, gray, cv.COLOR_RGBA2GRAY);

      // 2. Edge-Preserving Bilateral Filter
      cv.bilateralFilter(gray, smooth, 7, 50, 50);

      // 3. Clean Unsharp Mask + Contrast Stretch (Crisp dark characters on clean white background)
      let gauss = new cv.Mat();
      cv.GaussianBlur(smooth, gauss, new cv.Size(0, 0), 3.0);
      cv.addWeighted(smooth, 2.3, gauss, -1.3, 0, sharp);
      cv.normalize(sharp, norm, 0, 255, cv.NORM_MINMAX);

      cv.imshow('deblurCanvas', norm);

      mat.delete(); up.delete(); gray.delete(); smooth.delete(); sharp.delete(); norm.delete(); gauss.delete();
    }

    processBtn.addEventListener('click', async () => {
      if (!isCvReady() || !ocrWorker) return;
      processBtn.disabled = true;
      const resultCard = document.getElementById('resultCard');
      const logs = document.getElementById('pipelineLogs');
      resultCard.style.display = 'block';
      document.getElementById('plateNumber').textContent = "SCANNING...";
      logs.textContent = "Step 1: Isolating license plate & deskewing tilt angle...";

      try {
        let src = cv.imread(inputCanvas);
        let gray = new cv.Mat();
        let thresh = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
        cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);

        let contours = new cv.MatVector();
        let hier = new cv.Mat();
        cv.findContours(thresh, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let bestRect = null;
        let maxArea = 0;
        const imgArea = src.cols * src.rows;

        for (let i = 0; i < contours.size(); i++) {
          let cnt = contours.get(i);
          let rotRect = cv.minAreaRect(cnt);
          let w = rotRect.size.width;
          let h = rotRect.size.height;
          let angle = rotRect.angle;

          if (w < h) { [w, h] = [h, w]; angle += 90; }
          let aspect = w / (h || 1);
          let area = w * h;

          if (aspect >= 2.0 && aspect <= 5.5 && area > imgArea * 0.008 && area < imgArea * 0.7 && Math.abs(angle) < 40) {
            if (area > maxArea) {
              maxArea = area;
              bestRect = { center: rotRect.center, width: w, height: h, angle: angle };
            }
          }
        }

        let straightened = new cv.Mat();
        if (bestRect) {
          let M = cv.getRotationMatrix2D(bestRect.center, bestRect.angle, 1.0);
          let rotated = new cv.Mat();
          cv.warpAffine(src, rotated, M, new cv.Size(src.cols, src.rows), cv.INTER_CUBIC, cv.BORDER_REPLICATE);

          // Full width (0.495) + tighter vertical crop (0.38) to remove top/bottom dark bars
          let x = Math.max(0, Math.floor(bestRect.center.x - bestRect.width * 0.495));
          let y = Math.max(0, Math.floor(bestRect.center.y - bestRect.height * 0.38));
          let w = Math.min(rotated.cols - x, Math.floor(bestRect.width * 0.99));
          let h = Math.min(rotated.rows - y, Math.floor(bestRect.height * 0.76));

          let cropped = rotated.roi(new cv.Rect(x, y, w, h));
          cv.resize(cropped, straightened, new cv.Size(640, 180), 0, 0, cv.INTER_LANCZOS4);
          M.delete(); rotated.delete(); cropped.delete();
          logs.textContent = `Step 2: Plate deskewed (${bestRect.angle.toFixed(1)}° corrected). Reconstructing HD pixels...`;
        } else {
          cv.resize(src, straightened, new cv.Size(640, 180), 0, 0, cv.INTER_LANCZOS4);
        }

        cv.imshow('cropCanvas', straightened);
        await runNeuralDeblur(cropCanvas);

        logs.textContent = "Step 3: Running Tesseract v5 Worker OCR & RTO Syntax Engine...";
        const ret1 = await ocrWorker.recognize(deblurCanvas);
        let bestText = ret1.data.text;
        let bestConf = ret1.data.confidence;
        let parsed = fixIndianRTO(bestText);

        if (!parsed.valid) {
          const ret2 = await ocrWorker.recognize(cropCanvas);
          const parsed2 = fixIndianRTO(ret2.data.text);
          if (parsed2.valid || ret2.data.confidence > bestConf) {
            bestText = ret2.data.text;
            bestConf = ret2.data.confidence;
            parsed = parsed2;
          }
        }

        document.getElementById('plateNumber').textContent = parsed.formatted;
        logs.innerHTML = `Raw OCR Read: <b>${bestText.trim() || 'None'}</b> | Confidence: <b>${bestConf.toFixed(1)}%</b><br>Pipeline: Inner-Plate Deskew &rarr; Lanczos4 Super-Res &rarr; Unsharp Reconstruction &rarr; Tesseract v5 Worker`;

        src.delete(); gray.delete(); thresh.delete(); contours.delete(); hier.delete(); straightened.delete();
      } catch (e) {
        logs.textContent = "Error: " + e.message;
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
